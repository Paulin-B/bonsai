# A llama.cpp server for Bonsai, plus SearXNG for private web search.
#
#   cp docker-compose.example.yml docker-compose.yml
#   # edit the model paths below, then:
#   docker compose up -d bonsai-api searxng
#
# Bonsai talks to any OpenAI-compatible endpoint, so you can ignore this file
# entirely and point "Server URL" in Settings at LM Studio, Ollama, or a remote API.

services:
  bonsai-api:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: bonsai_api
    environment:
      # Which GPU to use, if you have more than one. Leave a card free for games.
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MODEL_DIR:-./models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >-
      -m /models/your-model.gguf
      --mmproj /models/your-mmproj.gguf
      --jinja
      -ngl 99
      -c 32768
      -np 1
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped

  # Private web search. Without it, turn "Web search" off in Settings.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
